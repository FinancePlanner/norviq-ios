disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - multiple_closures_with_trailing_closure
  - cyclomatic_complexity
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping
  - shorthand_optional_binding
  - unowned_variable_capture
  - weak_delegate
  - redundant_nil_coalescing

force_unwrapping:
  severity: warning

empty_count:
  severity: warning

identifier_name:
  min_length:
    error: 0
    warning: 1
  excluded:
    - to
    - ok
    - vm
    - x
    - y
    - i
    - v
    - id
    - up
    - at
    - q1
    - q2
    - q3
    - q4
    - fy
    - df
    - vm
    - k
    - ns
    - s
    - x
    - y
    - i

type_name:
  min_length: 3
  excluded:
    - ...

function_parameter_count:
  warning: 10
  error: 15

force_try:
  severity: warning

excluded:
  - .SourcePackages
  - build
  - .git
  - .cache
