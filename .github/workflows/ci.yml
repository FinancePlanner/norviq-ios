name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-26.3-derived-data-${{ hashFiles('financeplan.xcodeproj/project.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-derived-data-

      - name: Cache SwiftPM repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-xcode-26.3-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-swiftpm-

      - name: Resolve Package Dependencies (retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            xcodebuild -project financeplan.xcodeproj -scheme financeplan -resolvePackageDependencies && break
            echo "Resolve attempt $i failed; retrying in 20s..."
            sleep 20
          done

      - name: Build (no tests) to surface all Swift errors
        run: |
          xcodebuild build \
            -project financeplan.xcodeproj \
            -scheme financeplan \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet

      # Was pinned to two formatting/sorting classes, which meant a green
      # "Build and Test" only ever proved the app compiled. Every other unit
      # test — including the ones added by review agents that cannot run
      # xcodebuild — went unexecuted, and main accumulated real failures nobody
      # saw. Run the whole bundle.
      #
      # Parallel testing is off deliberately. xcodebuild clones the simulator
      # per worker, and the full bundle on a macos-15 runner aborts during
      # bootstrap — "Test crashed with signal abrt while preparing to run
      # tests", with each subsequent test landing on a fresh clone. The same
      # bundle passes on the same simulator locally, and two classes fit fine
      # in parallel, so it is runner capacity rather than a test defect.
      # Serial is slower but is the difference between a signal and a result.
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project financeplan.xcodeproj \
            -scheme financeplan \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:financeplanTests \
            -parallel-testing-enabled NO \
            -quiet

      - name: Run UI Smoke Tests
        run: |
          xcodebuild test \
            -project financeplan.xcodeproj \
            -scheme financeplan \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:financeplanUITests/StockDetailTabTests \
            -quiet

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
