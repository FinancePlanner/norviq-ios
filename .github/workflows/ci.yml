name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-26.3-derived-data-${{ hashFiles('financeplan.xcodeproj/project.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-derived-data-

      - name: Cache SwiftPM repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-xcode-26.3-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-swiftpm-

      - name: Resolve Package Dependencies (retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            xcodebuild -project financeplan.xcodeproj -scheme financeplan -resolvePackageDependencies && break
            echo "Resolve attempt $i failed; retrying in 20s..."
            sleep 20
          done

      # A generic destination compiles for the simulator SDK without needing a
      # concrete device, so a build break stays distinguishable from the runner
      # image having no simulators — which is exactly how they got confused.
      - name: Build (no tests) to surface all Swift errors
        run: |
          xcodebuild build \
            -project financeplan.xcodeproj \
            -scheme financeplan \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      # Hardcoding 'name=iPhone 16' made this job depend on the exact device
      # list in the macos-15 image. That list changed underneath us: runs went
      # from iPhone 16 on iOS 26.2, to no simulators at all — at which point
      # every step failed with "Unable to find a device matching the provided
      # destination specifier", which reads nothing like the infrastructure
      # problem it is. Resolve whatever iPhone the runner actually has, and if
      # there is none, say so in one line instead of failing four steps.
      - name: Resolve a simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available \
            | grep -E '^\s+iPhone' \
            | head -1 \
            | grep -oE '[0-9A-Fa-f-]{36}' || true)"
          if [ -z "$udid" ]; then
            echo "::error::No iOS simulator available on this runner. Available destinations:"
            xcodebuild -project financeplan.xcodeproj -scheme financeplan -showdestinations 2>&1 | sed -n '1,40p'
            exit 1
          fi
          name="$(xcrun simctl list devices available | grep "$udid" | sed -E 's/^ *([^(]+) \(.*/\1/')"
          echo "Using simulator: $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Gating subset. Deliberately narrow, because the full bundle cannot
      # currently complete on this runner — see the informational step below.
      - name: Run Unit Tests (gating subset)
        run: |
          xcodebuild test \
            -project financeplan.xcodeproj \
            -scheme financeplan \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:financeplanTests/StockComparisonFormattingTests \
            -only-testing:financeplanTests/StockComparisonSortingTests \
            -parallel-testing-enabled NO \
            -quiet

      # The full bundle, non-blocking. Read the log — a failure here is real
      # signal, it just cannot gate merges yet.
      #
      # Background: this step used to be the gating one and ran only the two
      # classes above, so a green "Build and Test" proved the app compiled and
      # nothing else. Turning the whole bundle on surfaced five genuine
      # failures that had been sitting on main unnoticed (fixed in #73) — and
      # also this, which is not a test defect:
      #
      #   Early unexpected exit, operation never finished bootstrapping.
      #   (Underlying Error: The test runner crashed while preparing to run
      #    tests: financeplan at <some test>)  /  Test crashed with signal abrt.
      #
      # The abort is in the app under test, and it kills the host, so one crash
      # reports as a suite-wide failure. The crash point MOVES as classes are
      # skipped — AppEnvironmentManagerTests, then BillingManagerTests and the
      # Keychain-backed SecurityCodeManager tests — so skipping classes is
      # whack-a-mole, not a fix.
      #
      # It does not reproduce locally: the full bundle passes on iPhone 16 and
      # on iPhone 17 / iOS 26.4.1. Ruled out: parallel simulator-clone capacity
      # (serial testing did not fix it) and a failable UserDefaults(suiteName:)
      # force-unwrap (hardened in #75; still crashes).
      #
      # Strong suspicion is the runner's simulators rather than the app. The
      # same image went from "iPhone 16, iOS 26.2" to no simulators at all
      # within a few hours, which is what forced the resolve step above — an
      # image that unstable is a plausible source of a bootstrap abrt too.
      #
      # Before assuming an app bug, re-run this on a healthy runner. If it is
      # still crashing, read the crash report inside Logs/Test/*.xcresult — the
      # failure list is a symptom, the abrt is the thing. Once it runs clean,
      # make this step gating and delete the subset above.
      - name: Run Unit Tests (full bundle, informational)
        continue-on-error: true
        run: |
          xcodebuild test \
            -project financeplan.xcodeproj \
            -scheme financeplan \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:financeplanTests \
            -parallel-testing-enabled NO \
            -quiet

      - name: Run UI Smoke Tests
        run: |
          xcodebuild test \
            -project financeplan.xcodeproj \
            -scheme financeplan \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:financeplanUITests/StockDetailTabTests \
            -quiet

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
