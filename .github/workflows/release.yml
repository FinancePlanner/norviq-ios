# iOS release pipeline.
#   "iOS CI" green on main -> TestFlight build (beta lane)
#   manual dispatch        -> App Store release (release/hotfix lane), gated by
#                             the GitHub environment "app-store" (required reviewer).
#
# The beta lane used to trigger on `push: main` directly, which made it a
# SIBLING of the iOS CI workflow, not a consumer: both started on the same
# commit at the same second, so a build shipped to TestFlight regardless of
# whether the tests went red. `workflow_run` makes it sequential and gated.
#
# Two consequences of workflow_run worth knowing:
#   * GitHub reads this trigger from the workflow file on the DEFAULT branch,
#     so this change only takes effect once it is on main.
#   * The event's github.sha/github.ref point at the default branch tip, not
#     the commit that was tested — hence the explicit head_sha checkout.
#
# Required repo secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (base64 .p8)  — App Store Connect API key
#   MATCH_PASSWORD                                       — match repo encryption
#   MATCH_GIT_BASIC_AUTHORIZATION                        — base64 "x-access-token:<PAT>",
#                                                          PAT with Contents:Read on norviq-certificates
#                                                          (deploy keys disabled org-wide)
#   SENTRY_ORG, SENTRY_PROJECT, SENTRY_AUTH_TOKEN        — dSYM upload (optional)
#   SECRETS_XCCONFIG                                     — full content of Config/Secrets.xcconfig
name: Release

on:
  workflow_run:
    workflows: ["iOS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: Release lane
        required: true
        type: choice
        options: [release, hotfix]
        default: release
      version:
        description: Marketing version (e.g. 1.1) — empty keeps current
        required: false
        type: string

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  beta:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    name: TestFlight (beta)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default-branch tip; build what CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Materialize Secrets.xcconfig
        run: printf '%s' "$SECRETS_XCCONFIG" > Config/Secrets.xcconfig
        env:
          SECRETS_XCCONFIG: ${{ secrets.SECRETS_XCCONFIG }}

      - name: Fastlane beta
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  release:
    if: github.event_name == 'workflow_dispatch'
    name: App Store (${{ inputs.lane }})
    runs-on: macos-15
    timeout-minutes: 90
    environment: app-store # required reviewer = the manual gate
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Materialize Secrets.xcconfig
        run: printf '%s' "$SECRETS_XCCONFIG" > Config/Secrets.xcconfig
        env:
          SECRETS_XCCONFIG: ${{ secrets.SECRETS_XCCONFIG }}

      - name: Fastlane ${{ inputs.lane }}
        run: bundle exec fastlane ${{ inputs.lane }} ${{ inputs.version != '' && format('version:{0}', inputs.version) || '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
